# Publie une release avec le bundle compile en piece jointe.
#
# Deux facons de la declencher :
#   - pousser un tag "buildNN" ;
#   - lancer ce workflow a la main (onglet Actions), en donnant le nom du tag :
#     il est alors CREE sur le commit courant.
#
# Le texte de la release vient de dist/NOTES-<tag>.md s'il existe, sinon de
# l'annotation du tag. Rien a fournir : GITHUB_TOKEN suffit, aucun secret.
name: Release

on:
  push:
    tags:
      - 'build*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Nom du tag a publier (ex. build66)"
        required: true
        default: build66

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choisir le tag
        id: tag
        run: |
          nom="${{ github.event.inputs.tag }}"
          [ -n "$nom" ] || nom="${GITHUB_REF_NAME}"
          echo "nom=$nom" >> "$GITHUB_OUTPUT"

      - name: Rassembler les notes
        id: notes
        run: |
          nom="${{ steps.tag.outputs.nom }}"
          if [ -f "dist/NOTES-$nom.md" ]; then
            cp "dist/NOTES-$nom.md" /tmp/notes.md
          else
            git tag -l --format='%(contents)' "$nom" > /tmp/notes.md
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "Bundle LV2 compile pour aarch64 (MOD Dwarf)." > /tmp/notes.md
          fi
          cat /tmp/notes.md

      - name: Publier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nom="${{ steps.tag.outputs.nom }}"
          # --target cree le tag sur ce commit s'il n'existe pas encore
          gh release create "$nom" \
            dist/nam-test-*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "NAM TEST $nom" \
            --notes-file /tmp/notes.md
