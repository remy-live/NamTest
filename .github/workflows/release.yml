# Publishes a release with the compiled bundle attached.
#
# Two ways to set it off:
#   - push a "buildNN" tag;
#   - run this workflow by hand (Actions tab), giving it the tag name: the tag
#     is then CREATED on the current commit.
#
# The release text comes from dist/NOTES-<tag>.md when that file exists, and
# from the tag's annotation otherwise. Nothing to provide: GITHUB_TOKEN is
# enough, no secret needed.
name: Release

on:
  push:
    tags:
      - 'build*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Name of the tag to publish (e.g. build67)"
        required: true
        default: build67

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the tag
        id: tag
        run: |
          name="${{ github.event.inputs.tag }}"
          [ -n "$name" ] || name="${GITHUB_REF_NAME}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Gather the notes
        id: notes
        run: |
          name="${{ steps.tag.outputs.name }}"
          if [ -f "dist/NOTES-$name.md" ]; then
            cp "dist/NOTES-$name.md" /tmp/notes.md
          else
            git tag -l --format='%(contents)' "$name" > /tmp/notes.md
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "LV2 bundle built for aarch64 (MOD Dwarf)." > /tmp/notes.md
          fi
          cat /tmp/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="${{ steps.tag.outputs.name }}"
          # Republishing a number that is already out must REPLACE it, not
          # fail: the release and its tag are remade on the current commit.
          if gh release view "$name" > /dev/null 2>&1; then
            gh release delete "$name" --yes --cleanup-tag
          fi
          # --target puts the tag on this commit
          gh release create "$name" \
            dist/nam_test_*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "NAM TEST $name" \
            --notes-file /tmp/notes.md
